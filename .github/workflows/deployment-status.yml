name: Deployment Status

on:
  push:
    branches:
      - main

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
      previous-sha: ${{ steps.get-commits.outputs.previous }}
      current-sha: ${{ steps.get-commits.outputs.current }}
      package-version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Get commit SHAs
        id: get-commits
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          PREVIOUS_SHA=$(git rev-parse HEAD~1)
          echo "current=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS_SHA" >> $GITHUB_OUTPUT

      - name: Get package version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.get-commits.outputs.current }}'.substring(0, 7);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: `## Deployment Information

**Current Commit:** ${{ steps.get-commits.outputs.current }}
**Previous Commit:** ${{ steps.get-commits.outputs.previous }}
**Package Version:** ${{ steps.get-version.outputs.version }}
**Triggered by:** ${{ github.actor }}
**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              labels: ['deployment', 'in-progress']
            });
            core.setOutput('issue-number', issue.data.number);
            return issue.data.number;

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-issue.outputs.issue-number }},
              body: 'Pre-deployment checks completed'
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact-checksum: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create rollback directory
        run: mkdir -p rollback-artifacts

      - name: Create rollback script
        run: |
          cat > rollback-artifacts/rollback.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Starting rollback procedure..."
          
          PREVIOUS_SHA="${{ needs.pre-deployment.outputs.previous-sha }}"
          CURRENT_SHA="${{ needs.pre-deployment.outputs.current-sha }}"
          
          if [ -z "$PREVIOUS_SHA" ]; then
            echo "Error: Previous commit SHA not provided"
            exit 1
          fi
          
          echo "Rolling back from $CURRENT_SHA to $PREVIOUS_SHA"
          
          # Verify git repository
          if [ ! -d ".git" ]; then
            echo "Error: Not a git repository"
            exit 1
          fi
          
          # Checkout previous commit
          git checkout "$PREVIOUS_SHA" || {
            echo "Error: Failed to checkout previous commit"
            exit 1
          }
          
          # Reinstall dependencies
          if [ -f "package-lock.json" ]; then
            npm ci || {
              echo "Warning: npm ci failed, trying npm install"
              npm install
            }
          fi
          
          echo "Rollback completed successfully to $PREVIOUS_SHA"
          EOF
          chmod +x rollback-artifacts/rollback.sh

      - name: Backup configuration files
        run: |
          cp package.json rollback-artifacts/
          cp package-lock.json rollback-artifacts/
          # Create environment template backup
          cat > rollback-artifacts/.env.template << 'EOF'
          # Environment variables template
          NODE_ENV=production
          PORT=3000
          # Add other environment variables as needed
          EOF

      - name: Create dependency verification script
        run: |
          cat > rollback-artifacts/verify-dependencies.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Verifying dependency compatibility..."
          
          # Check Node.js version
          NODE_VERSION=$(node --version)
          echo "Node.js version: $NODE_VERSION"
          
          # Check npm version
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          
          # Verify package-lock.json integrity
          if [ -f "package-lock.json" ]; then
            npm ci --dry-run || {
              echo "Warning: Dependency verification failed"
              exit 1
            }
          fi
          
          echo "✅ Dependency verification completed"
          EOF
          chmod +x rollback-artifacts/verify-dependencies.sh

      - name: Create rollback documentation
        run: |
          cat > rollback-artifacts/ROLLBACK.md << 'EOF'
          # Rollback Documentation
          
          ## Overview
          This package contains all necessary artifacts to rollback the deployment.
          
          ## Contents
          - `rollback.sh` - Executable rollback script
          - `package.json` - Package configuration backup
          - `package-lock.json` - Dependency lock file backup
          - `.env.template` - Environment variables template
          - `verify-dependencies.sh` - Dependency verification script
          
          ## Step-by-Step Rollback Instructions
          
          ### 1. Pre-rollback Verification
          ```bash
          ./verify-dependencies.sh
          ```
          
          ### 2. Execute Rollback
          ```bash
          ./rollback.sh
          ```
          
          ### 3. Verify Rollback
          - Check application status
          - Verify version: `node -p "require('./package.json').version"`
          - Run health checks
          
          ### 4. Post-rollback
          - Monitor application logs
          - Verify functionality
          - Update deployment tracking
          
          ## Quick Rollback Command
          ```bash
          chmod +x rollback.sh && ./rollback.sh
          ```
          EOF

      - name: Create compressed rollback package
        run: |
          cd rollback-artifacts
          tar -czf ../rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz .
          cd ..

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz | cut -d' ' -f1)
          echo "sha256=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "$CHECKSUM  rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz" > rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.sha256

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current-sha }}
          path: |
            rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.tar.gz
            rollback-package-${{ needs.pre-deployment.outputs.current-sha }}.sha256
            rollback-artifacts/
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🔄 Rollback Plan Ready
            
            **Previous Commit:** ${{ needs.pre-deployment.outputs.previous-sha }}
            **Current Commit:** ${{ needs.pre-deployment.outputs.current-sha }}
            **Package Version:** ${{ needs.pre-deployment.outputs.package-version }}
            **Artifact:** rollback-package-${{ needs.pre-deployment.outputs.current-sha }}
            
            ### Rollback Components
            ✅ Rollback script created
            ✅ Configuration files backed up
            ✅ Dependency verification script ready
            ✅ Documentation generated
            ✅ Compressed package created
            ✅ SHA256 checksum generated
            
            ### Quick Rollback Command
            \`\`\`bash
            chmod +x rollback.sh && ./rollback.sh
            \`\`\`
            
            **Rollback script created:** true
            **Configuration backup:** true
            **SHA256:** ${{ steps.checksum.outputs.sha256 }}
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue-number }},
              body: comment
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update issue labels
        uses: actions/github-script@v7
        with:
          script: |
            // Remove in-progress label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ needs.pre-deployment.outputs.issue-number }},
                name: 'in-progress'
              });
            } catch (e) {
              console.log('Label in-progress may not exist');
            }
            
            // Add completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue-number }},
              labels: ['completed']
            });

      - name: Post final deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ✅ Deployment Completed Successfully
            
            **Commit:** ${{ needs.pre-deployment.outputs.current-sha }}
            **Version:** ${{ needs.pre-deployment.outputs.package-version }}
            
            ### Rollback Artifact Details
            - **Artifact Name:** rollback-package-${{ needs.pre-deployment.outputs.current-sha }}
            - **SHA256:** ${{ needs.rollback-preparation.outputs.artifact-checksum }}
            - **Retention:** 30 days
            - **Download:** Available in [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            The deployment has been completed and rollback artifacts are ready if needed.
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue-number }},
              body: comment
            });

      - name: Close deployment issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue-number }},
              state: 'closed'
            });